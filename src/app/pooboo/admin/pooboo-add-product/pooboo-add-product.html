<div class="add-product-page">

  <div class="page-header">
    <div>
      <h2>Add Pooboo Product</h2>
      <p class="subtitle">Fill in the details below to add a new product</p>
    </div>
    <a routerLink="/admin/pooboo/products" class="btn-back">← Back to Products</a>
  </div>

  <!-- Success / Error -->
  <div *ngIf="successMsg" class="alert success">{{ successMsg }}</div>
  <div *ngIf="errorMsg"   class="alert error">{{ errorMsg }}</div>

  <div class="form-card">
    <form (ngSubmit)="onSubmit()">

      <!-- ROW 1: Name + Product Code -->
      <div class="form-row">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" [(ngModel)]="name" name="name" placeholder="e.g. Floral Frock" required />
        </div>
        <div class="form-group">
          <label>Product Code</label>
          <input type="text" [(ngModel)]="product_code" name="product_code" placeholder="e.g. PB-001" />
        </div>
      </div>

      <!-- ROW 2: Price + Stock -->
      <div class="form-row">
        <div class="form-group">
          <label>Price (₹) *</label>
          <input type="number" [(ngModel)]="price" name="price" placeholder="e.g. 499" required />
        </div>
        <div class="form-group">
          <label>Stock</label>
          <input type="number" [(ngModel)]="stock" name="stock" placeholder="e.g. 50" />
        </div>
      </div>

      <!-- ROW 3: Category + Age Group + Gender -->
      <div class="form-row three-col">
        <div class="form-group">
          <label>Category</label>
          <select [(ngModel)]="category" name="category">
            <option value="">Select category</option>
            <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Age Group</label>
          <select [(ngModel)]="age_group" name="age_group">
            <option value="">Select age group</option>
            <option *ngFor="let a of ageGroups" [value]="a">{{ a }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select [(ngModel)]="gender" name="gender">
            <option *ngFor="let g of genders" [value]="g">{{ g | titlecase }}</option>
          </select>
        </div>
      </div>

      <!-- ROW 4: Sizes + Colours -->
      <div class="form-row">
        <div class="form-group">
          <label>Sizes <span class="hint">(comma separated)</span></label>
          <input type="text" [(ngModel)]="sizesInput" name="sizes" placeholder="e.g. 1Y, 2Y, 3Y, 4Y" />
        </div>
        <div class="form-group">
          <label>Colours <span class="hint">(comma separated)</span></label>
          <input type="text" [(ngModel)]="coloursInput" name="colours" placeholder="e.g. Pink, Blue, White" />
        </div>
      </div>

      <!-- Description -->
      <div class="form-group full-width">
        <label>Description</label>
        <textarea [(ngModel)]="description" name="description" rows="3"
                  placeholder="Describe the product..."></textarea>
      </div>

      <!-- Details (bullet points) -->
      <div class="form-group full-width">
        <label>Product Details <span class="hint">(one point per line)</span></label>
        <textarea [(ngModel)]="detailsInput" name="details" rows="4"
                  placeholder="100% Cotton&#10;Machine washable&#10;Soft inner lining"></textarea>
      </div>

      <!-- Tags -->
      <div class="form-group full-width">
        <label>Tags <span class="hint">(preset badges + custom)</span></label>

        <div class="preset-tags-row">
          <button
            type="button"
            *ngFor="let tag of presetTags"
            class="preset-tag-btn"
            [class.active]="isTagSelected(tag)"
            (click)="togglePresetTag(tag)"
          >
            {{ tag }}
          </button>
        </div>

        <div class="custom-tag-input">
          <input
            type="text"
            [(ngModel)]="customTagInput"
            name="customTag"
            placeholder="Add a custom tag and press Enter"
            (keydown.enter)="$event.preventDefault(); addCustomTag()"
          />
          <button type="button" class="btn-add-tag" (click)="addCustomTag()">Add</button>
        </div>

        <div class="selected-tags-row" *ngIf="selectedTags.length">
          <span class="selected-tag-chip" *ngFor="let tag of selectedTags">
            {{ tag }}
            <button type="button" (click)="removeTag(tag)">✕</button>
          </span>
        </div>
      </div>

      <!-- Image Upload -->
      <div class="form-group full-width">
        <label>Product Image</label>
        <div class="image-upload-area" (click)="fileInput.click()">
          <div *ngIf="!imagePreview" class="upload-placeholder">
            <span class="upload-icon">📷</span>
            <span>Click to upload image</span>
          </div>
          <div *ngIf="imagePreview" class="image-preview-wrap">
            <img [src]="imagePreview" class="image-preview" alt="Preview" />
            <button type="button" class="remove-img" (click)="$event.stopPropagation(); removeImage()">✕</button>
          </div>
        </div>
        <input #fileInput type="file" accept="image/*" (change)="onFileChange($event)" hidden />
      </div>

      <!-- Toggles -->
      <div class="form-row toggles-row">
        <label class="toggle-label">
          <input type="checkbox" [(ngModel)]="is_customizable" name="is_customizable" />
          <span>Customizable</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" [(ngModel)]="is_active" name="is_active" />
          <span>Active (visible on store)</span>
        </label>
      </div>

      <!-- Submit -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" routerLink="/admin/pooboo/products">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="submitting">
          {{ submitting ? 'Adding...' : 'Add Product' }}
        </button>
      </div>

    </form>
  </div>

</div>
