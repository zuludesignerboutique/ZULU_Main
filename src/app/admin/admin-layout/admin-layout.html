<!-- ADMIN LAYOUT WRAPPER -->
<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      ZULU Admin
      <span></span>
    </div>

    <nav class="sidebar-nav">

      <a routerLink="/admin/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         class="sidebar-link">
        <span class="sidebar-icon">▦</span> Dashboard
      </a>

      <!-- ── ZULU ── -->
      <div class="sidebar-section-label">ZULU</div>

      <a routerLink="/admin/products"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">◫</span> Products
      </a>

      <a routerLink="/admin/add-product"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">＋</span> Add Product
      </a>

      <a routerLink="/admin/orders"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">◑</span> Orders
      </a>

      <a routerLink="/admin/stock"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">▤</span> Stock
      </a>

      <a routerLink="/admin/transactions"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">₹</span> Transactions
      </a>

      <!-- ── POOBOO ── -->
      <div class="sidebar-section-label">POOBOO</div>

      <a routerLink="/admin/pooboo/products"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">◫</span> Products
      </a>

      <a routerLink="/admin/pooboo/add-product"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">＋</span> Add Product
      </a>

      <a routerLink="/admin/pooboo/fabrics"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">🧵</span> Fabrics
      </a>

      <a routerLink="/admin/pooboo/accessories"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">🎀</span> Accessories
      </a>

      <a routerLink="/admin/pooboo/enquiries"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">✉</span> Enquiries
      </a>

      <a routerLink="/admin/pooboo/reviews"
         routerLinkActive="active"
         class="sidebar-link">
        <span class="sidebar-icon">★</span> Reviews
      </a>

    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="admin-content">
    <div class="admin-topbar">
      <span class="topbar-title">Admin Panel</span>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
    <div class="admin-body">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
