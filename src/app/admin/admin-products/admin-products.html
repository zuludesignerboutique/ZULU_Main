<h2 class="page-title">Manage Products</h2>

<div class="page-header">
  <div class="header-meta">
    <span class="breadcrumb">ADMIN PANEL</span>
    <h2 class="page-title">Products</h2>
  </div>
  <button class="add-btn" routerLink="/admin/add-product">
    <span class="add-icon">+</span> Add Product
  </button>
</div>

<div class="table-card">

  <div class="table-toolbar">
    <span class="product-count">{{ products.length }} Products</span>
  </div>

  <table class="product-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Image</th>
        <th>Name</th>
        <th>Price</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody *ngIf="products.length > 0">
      <tr *ngFor="let product of products; trackBy: trackById">
        <td class="col-id">#{{ product.id }}</td>
        <td class="col-img">
          <div class="img-wrapper">
            <img
              [src]="'/uploads/' + product.image_url"
              [alt]="product.name"
            >
          </div>
        </td>
        <td class="col-name">{{ product.name }}</td>
        <td class="col-price">₹{{ product.price }}</td>
        <td class="col-actions">
          <button class="btn-edit" [routerLink]="['/admin/edit-product', product.id]">Edit</button>
          <button class="btn-delete" (click)="deleteProduct(product.id)">Delete</button>
        </td>
      </tr>
    </tbody>
    <tbody *ngIf="products.length === 0">
      <tr>
        <td colspan="5" class="empty-state">No products found.</td>
      </tr>
    </tbody>
  </table>

</div>
