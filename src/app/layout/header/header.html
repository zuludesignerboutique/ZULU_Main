    <a *ngIf="isLoggedIn(); else cartLogin"

    <ng-template #cartLogin>
      <a routerLink="/login"
         [queryParams]="{ returnUrl: '/cart' }"
         class="nav-link">

      </a>

    <a *ngIf="isLoggedIn(); else wishlistLogin"

      <a routerLink="/login"
         [queryParams]="{ returnUrl: '/wishlist' }"
         class="nav-link">

      </a>
    </ng-template>

    <a *ngIf="!isLoggedIn()"

       class="nav-link">

    <!-- LOGOUT -->
    <button

      (click)="logout()"
      class="logout-icon-btn"

      aria-label="Logout"
      title="Logout">

    </button>

  </nav>
</div>
