<!-- TOP BAR -->
<div class="top-bar">
  <span class="top-bar-inner">
    <span class="top-bar-dot">✦</span>
    Turn moments into looks
    <span class="top-bar-dot">✦</span>
  </span>
</div>

<!-- MAIN HEADER -->
<header class="main-header" style="background-image: url(assets/images/header2.jpg); background-size: cover; background-position: center;">

  <div class="header-overlay"></div>

  <div class="header-inner container-fluid px-4">

    <!-- LOGO -->
    <div class="logo" routerLink="/home" aria-label="ZULU home">
      <span class="logo-text">ZULU</span>
      <span class="logo-tagline">Boutique</span>
    </div>

    <!-- DESKTOP NAV -->
    <nav class="nav-menu">
      <a routerLink="/home"     routerLinkActive="active" class="nav-link">Home</a>
      <a routerLink="/products" routerLinkActive="active" class="nav-link">Products</a>
      <a routerLink="/gallery"  routerLinkActive="active" class="nav-link">Gallery</a>
      <a routerLink="/reviews"  routerLinkActive="active" class="nav-link">Reviews</a>
      <a routerLink="/contact"  routerLinkActive="active" class="nav-link">Contact</a>
    </nav>

    <!-- ACTIONS -->
    <div class="nav-actions">

      <!-- CART -->
      <a *ngIf="isLoggedIn(); else cartLogin"
         routerLink="/cart"
         routerLinkActive="active"
         class="action-btn"
         aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span>Cart</span>
      </a>
      <ng-template #cartLogin>
        <a routerLink="/login" [queryParams]="{ returnUrl: '/cart' }" class="action-btn" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <span>Cart</span>
        </a>
      </ng-template>

      <!-- WISHLIST -->
      <a *ngIf="isLoggedIn(); else wishlistLogin"
         routerLink="/wishlist"
         routerLinkActive="active"
         class="action-btn"
         aria-label="Wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
        </svg>
        <span>Wishlist</span>
      </a>
      <ng-template #wishlistLogin>
        <a routerLink="/login" [queryParams]="{ returnUrl: '/wishlist' }" class="action-btn" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
          </svg>
          <span>Wishlist</span>
        </a>
      </ng-template>

      <!-- ORDER HISTORY (only for logged-in users) -->
      <a *ngIf="isLoggedIn()"
         routerLink="/order-history"
         routerLinkActive="active"
         class="action-btn"
         aria-label="My Orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <line x1="9" y1="12" x2="15" y2="12"/>
          <line x1="9" y1="16" x2="13" y2="16"/>
        </svg>
        <span>Orders</span>
      </a>

      <!-- LOGIN -->
      <a *ngIf="!isLoggedIn()" routerLink="/login" class="action-btn login-btn">
        Login
      </a>

      <!-- LOGOUT -->
      <button *ngIf="isLoggedIn()" (click)="logout()" class="action-btn logout-btn" type="button" aria-label="Logout" title="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>

    </div>

  </div>

</header>
