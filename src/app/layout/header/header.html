<!-- TOP BAR -->
<div class="top-bar">
  <span class="top-bar-inner">
    <span class="top-bar-dot">✦</span>
    Turn moments into looks
    <span class="top-bar-dot">✦</span>
  </span>
</div>

<!-- MAIN HEADER -->
<header class="main-header" >

  <div class="header-overlay"></div>

  <div class="header-inner container-fluid px-4">

    <!-- LOGO -->
    <div class="logo" routerLink="/home" aria-label="ZULU home">
      <img src="assets/images/ZULU white.png" alt="ZULU Boutique" class="logo-img" />
    </div>
   
    <!-- DESKTOP NAV -->
    <nav class="nav-menu">
      <a routerLink="/home"     routerLinkActive="active" class="nav-link">Home</a>
      <a routerLink="/products" routerLinkActive="active" class="nav-link">Products</a>
      <a routerLink="/gallery"  routerLinkActive="active" class="nav-link">Gallery</a>
      <a routerLink="/reviews"  routerLinkActive="active" class="nav-link">Reviews</a>
      <a routerLink="/contact"  routerLinkActive="active" class="nav-link">Contact</a>
    </nav>

    <!-- ACTIONS — single user icon with dropdown -->
    <div class="nav-actions">
      <div class="user-menu-wrap" [class.open]="menuOpen" >

        <!-- Trigger button -->
        <button class="user-icon-btn" (click)="toggleMenu()" type="button" aria-label="Account menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </button>

        <!-- Dropdown -->
        <div class="user-dropdown" (click)="menuOpen = false">

          <a routerLink="/" class="drop-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Shops</span>
          </a>

          <div class="drop-divider"></div>

          <!-- My Dashboard (only when logged in) — cart/wishlist/orders now live inside it -->
          <a *ngIf="isLoggedIn()"
             routerLink="/dashboard"
             class="drop-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            <span>My Dashboard</span>
          </a>

          <!-- Login (only when logged out) -->
          <a *ngIf="!isLoggedIn()" routerLink="/login" class="drop-item login-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            <span>Login</span>
          </a>

          <!-- Logout (only when logged in) -->
          <button *ngIf="isLoggedIn()" (click)="logout()" class="drop-item logout-item" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Logout</span>
          </button>

        </div>
      </div>

      <!-- Mobile hamburger -->
      <button class="hamburger-btn" (click)="toggleMobileNav()" type="button"
              aria-label="Menu" [attr.aria-expanded]="mobileNavOpen">
        <span [class.open]="mobileNavOpen"></span>
        <span [class.open]="mobileNavOpen"></span>
        <span [class.open]="mobileNavOpen"></span>
      </button>

    </div>
  </div>

  <!-- MOBILE NAV -->
  <div class="mobile-nav-wrap" [class.open]="mobileNavOpen">
    <nav class="mobile-nav" (click)="mobileNavOpen = false">
      <a routerLink="/home"     routerLinkActive="active" class="mobile-link">Home</a>
      <a routerLink="/products" routerLinkActive="active" class="mobile-link">Products</a>
      <a routerLink="/gallery"  routerLinkActive="active" class="mobile-link">Gallery</a>
      <a routerLink="/reviews"  routerLinkActive="active" class="mobile-link">Reviews</a>
      <a routerLink="/contact"  routerLinkActive="active" class="mobile-link">Contact</a>
    </nav>
  </div>

</header>
