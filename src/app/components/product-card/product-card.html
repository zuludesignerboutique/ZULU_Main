<div class="product-card" [routerLink]="['/products', product.id]">
  <div class="image-wrapper">
    <img
      class="product-img"
      [src]="product.image"
      alt="{{ product.name }}"
      loading="lazy"              
      decoding="async"           
    />
  </div>

  <div class="product-info">
    <h5>{{ product.name }}</h5>
    <p>{{ product.price | currency:'INR' }}</p>
  </div>

  <div class="actions">
    <button (click)="addToCart($event)">Add to Cart</button>
    <button (click)="addToWishlist($event)">Wishlist</button>
  </div>
</div>
