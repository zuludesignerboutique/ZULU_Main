<div class="product-card" (click)="goToProduct(product)">

  <div class="image-box">
    <button
      class="wishlist-heart"
      [class.active]="wishlisted"
      [class.pop]="justToggled"
      [attr.aria-label]="wishlisted ? 'Remove from wishlist' : 'Add to wishlist'"
      (click)="toggleWishlist(product); $event.stopPropagation()"
    >
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M12 21s-6.7-4.35-9.33-8.2C.86 10.1 1.2 6.6 4 4.9 6.2 3.6 8.9 4.3 10.4 6.4L12 8.5l1.6-2.1C15.1 4.3 17.8 3.6 20 4.9c2.8 1.7 3.14 5.2 1.33 7.9C18.7 16.65 12 21 12 21Z"/>
      </svg>
    </button>

    <img
      class="product-img"
      [src]="getImageUrl(product.image_url)"
      [alt]="product.name"
      loading="lazy"
      decoding="async"
    />
  </div>

  <div class="product-info">
    <h4>{{ product.name }}</h4>

    <p class="category">{{ product.category || '\u00A0' }}</p>

    <div class="price-row">
      <span class="price">{{ product.price | number }}</span>
      <button class="view-btn" (click)="$event.stopPropagation(); goToProduct(product)">
        <span>View</span>
      </button>
    </div>

    <div class="actions">
      <button class="action-btn" (click)="addToCart(product); $event.stopPropagation()">
        <span>Add to Cart</span>
      </button>
    </div>
  </div>

</div>
