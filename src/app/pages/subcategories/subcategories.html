<section class="container mt-5">

  <h2 class="text-center mb-5 text-capitalize">
    {{ categoryType }} Collection
  </h2>

  <div class="row">

    <div class="col-md-4 mb-4" *ngFor="let sub of subcategories">

      <div class="subcategory-card text-center">

        <img
          [src]="sub.image"
          class="img-fluid"
        >

        <h5 class="mt-3">
          {{ sub.name }}
        </h5>

      </div>

    </div>

  </div>

</section>
