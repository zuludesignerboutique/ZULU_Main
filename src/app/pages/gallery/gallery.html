<section class="gallery-section">
  <div class="container">
    <h2 class="section-title">Our Collection</h2>

    <div class="gallery-grid">
      <div
        class="gallery-card"
        *ngFor="let img of images; trackBy: trackById"
      >
        <img
          [src]="img.imageUrl"
          [alt]="img.title"
          loading="lazy"        
          decoding="async"      
        />

        <div class="overlay">
          <h3>{{ img.title }}</h3>
        </div>
      </div>
    </div>
  </div>
</section>
