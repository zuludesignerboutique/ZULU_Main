<section class="gallery-section">

  <!-- HEADER -->
  <div class="section-header">
    <p class="eyebrow">Visual Story</p>
    <h2>Our <em>Collection</em></h2>
  </div>

  <!-- SKELETONS -->
  <div class="gallery-skeleton" *ngIf="isLoading">
    <div class="sk-card" *ngFor="let s of skeletons"></div>
  </div>

  <!-- MASONRY GRID -->
  <div class="gallery-grid" *ngIf="!isLoading">

    <div
      class="gallery-card"
      *ngFor="let img of images; trackBy: trackById; let i = index"
      (click)="openLightbox(i)"
          style="border-radius: 20px;">
      <img
        [src]="img.imageUrl"
        [alt]="img.title"
        loading="lazy"
        decoding="async"
      >

      <div class="overlay">
        <span class="overlay-zoom">⊕</span>
        <span class="overlay-title">{{ img.title }}</span>
        <span class="overlay-desc" *ngIf="img.description">{{ img.description }}</span>
      </div>

    </div>

  </div>

  <!-- EMPTY STATE -->
  <div class="empty-state" *ngIf="!isLoading && images.length === 0">
    <div class="empty-icon">◈</div>
    <p>No images yet</p>
  </div>

</section>

<!-- LIGHTBOX — PowerPoint-style presentation -->
<div
  class="lightbox-backdrop"
  *ngIf="lightboxIndex !== null"
  (click)="closeLightbox()"
  (keydown.escape)="closeLightbox()"
>

  <div class="presentation" (click)="$event.stopPropagation()">

    <button class="lightbox-close" (click)="closeLightbox()">✕</button>

    <button class="lightbox-nav prev" (click)="lightboxStep(-1)" aria-label="Previous image">‹</button>

    <!-- LEFT — large image -->
    <div class="presentation-media" [class.animating]="transitioning">
      <img
        [src]="currentImage!.imageUrl"
        [alt]="currentImage!.title"
      >
    </div>

    <!-- RIGHT — title, description, counter -->
    <div class="presentation-content" [class.animating]="transitioning">
      <span class="presentation-eyebrow">Gallery</span>
      <h2 class="presentation-title">{{ currentImage!.title }}</h2>
      <p class="presentation-desc" *ngIf="currentImage!.description">{{ currentImage!.description }}</p>
      <div class="presentation-counter">{{ currentNumber }} / {{ totalCount }}</div>
    </div>

    <button class="lightbox-nav next" (click)="lightboxStep(1)" aria-label="Next image">›</button>

  </div>

</div>
