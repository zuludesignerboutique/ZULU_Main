<div class="auth-page">

  <!-- LEFT PANEL -->
  <div class="auth-panel-left">
    <div class="panel-noise"></div>
    <div class="panel-orb orb-a"></div>
    <div class="panel-orb orb-b"></div>

    <div class="panel-brand">
      <div class="panel-eyebrow">
        <span class="eyebrow-line"></span>
        <span>Boutique</span>
        <span class="eyebrow-line"></span>
      </div>
      <h1 class="panel-logo">ZULU</h1>
      <p class="panel-tagline">Where Elegance<br>Meets Identity</p>
    </div>

    <div class="panel-footer-quote">
      "Style is a way to say<br>who you are without speaking."
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="auth-panel-right">
    <div class="auth-card">

      <div class="auth-header">
        <div class="auth-eyebrow">Join the family</div>
        <h2 class="auth-title">Create Your Account</h2>
        <p class="auth-sub">Start your journey with ZORA boutique</p>
      </div>

      <form (ngSubmit)="signup()" class="auth-form">

        <div class="field-group">
          <label class="field-label" for="signup-name">Full Name</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              id="signup-name"
              type="text"
              placeholder="Your full name"
              [(ngModel)]="name"
              name="name"
              required
              class="field-input"
            />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="signup-email">Email address</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              id="signup-email"
              type="email"
              placeholder="you@example.com"
              [(ngModel)]="email"
              name="email"
              required
              class="field-input"
            />
          </div>
        </div>

        <div class="fields-row">

          <div class="field-group">
            <label class="field-label" for="signup-password">Password</label>
            <div class="field-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
              <input
                id="signup-password"
                type="password"
                placeholder="••••••••"
                [(ngModel)]="password"
                name="password"
                required
                class="field-input"
              />
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="signup-confirm">Confirm Password</label>
            <div class="field-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <input
                id="signup-confirm"
                type="password"
                placeholder="••••••••"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                required
                class="field-input"
              />
            </div>
          </div>

        </div>

        <p class="error-msg" *ngIf="error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ error }}
        </p>

        <button type="submit" class="auth-btn">
          <span>Create Account</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

      </form>

      <p class="auth-switch">
        Already have an account?
        <a routerLink="/login" class="auth-link">Sign in →</a>
      </p>

    </div>
  </div>

</div>
