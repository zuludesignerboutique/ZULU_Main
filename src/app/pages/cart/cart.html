<div class="container my-5">
  <h2 class="mb-4 cart-title">Your Cart</h2>

  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty ✨</p>
    <a routerLink="/products" class="btn-shop-now">Shop Now</a>
  </div>

  <div class="cart-card" *ngFor="let item of cartItems">
    <div class="cart-img">
      <img [src]="'http://localhost:4000/uploads/' + item.image_url" [alt]="item.name" />
    </div>
    <div class="cart-info">
      <h4>{{ item.name }}</h4>
      <p class="cart-desc">{{ item.description }}</p>

      <!-- ✅ Show selected size -->
      <p class="cart-size" *ngIf="item.size">
        <span class="size-label">Size:</span>
        <span class="size-badge">{{ item.size }}</span>
      </p>

      <p class="cart-price">{{ item.price * (item.qty || 1) | currency:'INR' }}</p>

      <!-- ✅ Quantity control — pass size so the right row updates -->
      <div class="qty-control">
        <button class="qty-btn" (click)="updateQty(item.id, -1, item.size)">−</button>
        <span class="qty-value">{{ item.qty || 1 }}</span>
        <button class="qty-btn" (click)="updateQty(item.id, +1, item.size)">+</button>
      </div>

      <button class="btn-remove" (click)="removeFromCart(item.id, item.size)">Remove</button>
    </div>
  </div>

  <div class="cart-footer" *ngIf="cartItems.length > 0">
    <div class="cart-total-row">
      <span class="cart-total-label">Total Amount</span>
      <span class="cart-total-value">₹{{ total | number }}</span>
    </div>
    <div class="cart-footer-actions">
      <button class="btn-clear" (click)="clearCart()">Clear Cart</button>
      <button class="btn-checkout" (click)="goToCheckout()">
        Proceed to Checkout →
      </button>
    </div>
  </div>
</div>
