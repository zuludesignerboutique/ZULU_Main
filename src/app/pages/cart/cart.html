<div class="container my-5">
  <h2 class="mb-4 cart-title">Your Cart</h2>

  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty ✨</p>
  </div>

  <div class="cart-card" *ngFor="let item of cartItems">
    <div class="cart-img">
      <img [src]="'http://localhost:4000/uploads/' + item.image_url" [alt]="item.name" />
    </div>

    <div class="cart-info">
      <h4>{{ item.name }}</h4>
      <p class="cart-desc">{{ item.description }}</p>
      <p class="cart-price">{{ item.price | currency:'INR' }}</p>

      <button class="btn-remove" (click)="removeFromCart(item.id)">
        Remove
      </button>
    </div>
  </div>

  <div class="cart-footer" *ngIf="cartItems.length > 0">
    <button class="btn-clear" (click)="clearCart()">Clear Cart</button>
  </div>
</div>
