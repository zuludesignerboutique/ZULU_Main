<section class="categories-page container">

  <h2 class="text-center mb-5">Shop by Category</h2>

  <div class="row">

    <div
      class="col-md-3 mb-4"
      *ngFor="let category of categories"
    >

      <div
        class="category-card text-center"
        [routerLink]="category.route"
      >

        <img
          [src]="category.image"
          class="img-fluid"
          alt="{{category.name}}"
        >

        <h4 class="mt-3">{{ category.name }}</h4>

      </div>

    </div>

  </div>

</section>
