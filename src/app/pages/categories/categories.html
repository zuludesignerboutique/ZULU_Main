<section class="categories-page container">

  <h2 class="text-center mb-5">Shop by Category</h2>

  <!-- LOADING -->
  <div class="cat-status text-center" *ngIf="isLoading">Loading categories...</div>

  <!-- ERROR -->
  <div class="cat-status text-center" *ngIf="!isLoading && errorMsg">{{ errorMsg }}</div>

  <!-- EMPTY -->
  <div class="cat-status text-center" *ngIf="!isLoading && !errorMsg && categories.length === 0">
    No categories yet. Add one from the admin panel.
  </div>

  <!-- CATEGORY GRID -->
  <div class="row" *ngIf="!isLoading && categories.length > 0">

    <div
      class="col-md-3 mb-4"
      *ngFor="let category of categories"
    >

      <div
        class="category-card text-center"
        [routerLink]="category.route"
      >

        <img
          [src]="category.image"
          class="img-fluid"
          alt="{{category.name}}"
        >

        <h4 class="mt-3">{{ category.name }}</h4>

      </div>

    </div>

  </div>

</section>
