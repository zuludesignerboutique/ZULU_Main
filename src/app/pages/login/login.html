<div class="auth-container">
  <h2>Login to ZORA</h2>

  <form (ngSubmit)="login()">
    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      name="email"
      required
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
      required
    />

    <button type="submit">Login</button>
  </form>

  <p class="error" *ngIf="error">{{ error }}</p>

  <p class="switch">
    Don’t have an account?
    <a routerLink="/signup">Sign up</a>
  </p>
</div>
